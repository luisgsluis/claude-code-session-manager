<!DOCTYPE html>
<html lang="es" class="dark" :lang="lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Claude Sessions</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/terminal-grid.css">
<link rel="stylesheet" href="/static/css/voice.css">
<script src="/static/js/skin-init.js"></script>
<script defer src="/static/js/alpine.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body class="bg-bg text-fg min-h-screen" x-data="ccsmApp()" x-init="init()" x-cloak>

<!-- Header -->
<header class="bg-bg-card border-b border-gray-800 sticky top-0 z-50">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🤖</span>
      <h1 class="text-lg font-semibold">Claude Sessions</h1>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-sm text-fg-muted hidden sm:inline mr-1" x-text="userLabel"></span>

      <!-- Language selector -->
      <div class="relative" x-data="{ open: false }">
        <button @click="open = !open"
          class="text-sm text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors"
          x-text="'🌐 ' + (lang === 'es' ? 'ES' : 'EN')"></button>
        <div x-show="open" @click.outside="open = false"
          class="absolute right-0 top-full mt-1 bg-bg-card border border-gray-700 rounded-xl shadow-xl py-1 min-w-[110px] z-50">
          <button @click="setLang('es'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="lang === 'es' ? 'text-accent font-medium' : 'text-fg'">Español</button>
          <button @click="setLang('en'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="lang === 'en' ? 'text-accent font-medium' : 'text-fg'">English</button>
        </div>
      </div>

      <!-- Skin selector -->
      <div class="relative" x-data="{ open: false }">
        <button @click="open = !open"
          class="text-sm text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors"
          :title="t('skin_' + skin)"
          x-text="skin === 'light' ? '☀️' : (skin === 'contrast' ? '⚡' : (skin === 'solarized' ? '🌊' : '🌙'))"></button>
        <div x-show="open" @click.outside="open = false"
          class="absolute right-0 top-full mt-1 bg-bg-card border border-gray-700 rounded-xl shadow-xl py-1 min-w-[140px] z-50">
          <button @click="setSkin('light'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="skin === 'light' ? 'text-accent font-medium' : 'text-fg'">☀️ <span x-text="t('skin_light')"></span></button>
          <button @click="setSkin('dark'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="skin === 'dark' ? 'text-accent font-medium' : 'text-fg'">🌙 <span x-text="t('skin_dark')"></span></button>
          <button @click="setSkin('solarized'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="skin === 'solarized' ? 'text-accent font-medium' : 'text-fg'">🌊 <span x-text="t('skin_solarized')"></span></button>
          <button @click="setSkin('contrast'); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors"
            :class="skin === 'contrast' ? 'text-accent font-medium' : 'text-fg'">⚡ <span x-text="t('skin_contrast')"></span></button>
        </div>
      </div>

      <!-- Refresh (junto al idioma) -->
      <button @click="reloadAll()"
        class="text-sm text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors"
        :title="t('refresh')">🔄 <span x-text="t('refresh')"></span></button>

      <!-- Settings menu -->
      <button x-show="notify.supported" @click="toggleNotify()"
        class="text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors text-lg leading-none"
        :title="notify.permission === 'granted' ? (notify.muted ? t('notify_muted') : t('notify_unmuted')) : (notify.permission === 'denied' ? t('notify_denied') : t('notify_grant'))"
        x-text="notify.permission === 'granted' ? (notify.muted ? '🔕' : '🔔') : (notify.permission === 'denied' ? '🚫' : '🔔')"></button>
      <div class="relative" x-data="{ open: false }">
        <button @click="open = !open"
          class="text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors text-lg leading-none"
          title="Settings" x-text="'☰'"></button>
        <div x-show="open" @click.outside="open = false"
          class="absolute right-0 top-full mt-1 bg-bg-card border border-gray-700 rounded-xl shadow-xl py-1 min-w-[220px] z-50">
          <button @click="openSettings(); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors">⚙️ <span x-text="t('cfg_title')"></span></button>
          <button @click="viewCurrentSettings(); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors">📄 <span x-text="t('cfg_view_settings')"></span></button>
          <button @click="openAudit(); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors">🕘 <span x-text="t('audit_title')"></span></button>
          <button @click="openMetrics(); open = false"
            class="block w-full text-left px-4 py-2 text-sm hover:bg-bg-hover transition-colors">📊 <span x-text="t('metrics_title')"></span></button>
        </div>
      </div>

      <button @click="logout" class="text-sm text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors" x-text="t('logout')"></button>
    </div>
  </div>

  <!-- Top action bar (before the session list) -->
  <div class="px-4 pb-3 flex flex-wrap items-center gap-2 border-t border-gray-800 pt-3">
    <!-- Quick session: everything default, opens the session right away -->
    <button @click="newSessionQuick()" :disabled="actionLoading"
      class="px-4 py-2 bg-accent hover:bg-accent-hover text-white rounded-xl text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-wait">
      ⚡ <span x-text="t('new_quick')"></span>
    </button>

    <!-- New session with options (tmux name, Claude name, profile) -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" :disabled="actionLoading"
        class="px-4 py-2 bg-bg-card border border-gray-700 hover:border-gray-600 rounded-xl text-sm font-medium transition-colors disabled:opacity-50">
        🎛️ <span x-text="t('new_advanced')"></span> ▾
      </button>
      <div x-show="open" @click.outside="open = false"
        class="absolute top-full mt-1 left-0 bg-bg-card border border-gray-700 rounded-xl shadow-xl p-4 min-w-[260px] z-50 space-y-3">
        <div>
          <label for="adv-tmux" class="block text-xs text-fg-muted mb-1" x-text="t('adv_tmux')"></label>
          <input id="adv-tmux" type="text" x-model="adv.tmux" :placeholder="t('adv_tmux_ph')"
            class="w-full bg-bg border border-gray-700 rounded-lg px-3 py-2 text-sm text-fg placeholder:text-fg-muted/60 focus:outline-none focus:border-accent transition-colors">
        </div>
        <div>
          <label for="adv-claude" class="block text-xs text-fg-muted mb-1" x-text="t('adv_claude')"></label>
          <input id="adv-claude" type="text" x-model="adv.claude" :placeholder="adv.tmux || t('adv_claude_ph')"
            class="w-full bg-bg border border-gray-700 rounded-lg px-3 py-2 text-sm text-fg placeholder:text-fg-muted/60 focus:outline-none focus:border-accent transition-colors">
        </div>
        <div>
          <label for="adv-profile" class="block text-xs text-fg-muted mb-1" x-text="t('adv_profile')"></label>
          <select id="adv-profile" x-model="adv.profile"
            class="w-full bg-bg border border-gray-700 rounded-lg px-3 py-2 text-sm text-fg focus:outline-none focus:border-accent transition-colors">
            <option value="" x-text="t('adv_profile_default') + (activeProfileName() ? ' · ' + activeProfileName() : '')"></option>
            <template x-for="p in profiles" :key="p.name">
              <option :value="p.name" x-text="(isActiveProfile(p) ? '✓ ' : '') + (p.label || p.name)"></option>
            </template>
          </select>
        </div>
        <div>
          <label for="adv-project" class="block text-xs text-fg-muted mb-1" x-text="t('adv_project')"></label>
          <select id="adv-project" x-model="adv.project"
            class="w-full bg-bg border border-gray-700 rounded-lg px-3 py-2 text-sm text-fg focus:outline-none focus:border-accent transition-colors">
            <option value="principal" x-text="t('adv_project_default')"></option>
            <template x-for="p in sortedProjects()" :key="p.name">
              <option :value="p.name" x-text="projectLabel(p.name)" :title="p.path"></option>
            </template>
          </select>
          <p class="text-[11px] text-fg-muted mt-1 font-mono truncate" x-text="selectedProjectPath()"></p>
        </div>
        <button @click="newSessionAdvanced(); open = false" :disabled="actionLoading"
          class="w-full px-4 py-2 bg-accent hover:bg-accent-hover text-white rounded-xl text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-wait">
          <span x-text="t('adv_create')"></span>
        </button>
      </div>
    </div>

    <!-- Change profile -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" :disabled="actionLoading"
        class="px-4 py-2 bg-bg-card border border-gray-700 hover:border-gray-600 rounded-xl text-sm font-medium transition-colors disabled:opacity-50">
        ⚙️ <span x-text="t('change_profile')"></span> ▾
      </button>
      <div x-show="open" @click.outside="open = false"
        class="absolute top-full mt-1 left-0 bg-bg-card border border-gray-700 rounded-xl shadow-xl py-1 min-w-[200px] z-50">
        <div class="px-4 pt-2 pb-1 text-xs text-fg-muted" x-text="t('pick_profile_apply')"></div>
        <template x-for="p in profiles" :key="p.name">
          <div class="flex items-center hover:bg-bg-hover transition-colors">
            <button @click="open = false; applyProfile(p.name)"
              class="flex-1 text-left px-4 py-2 text-sm">
              <span x-text="p.label || p.name"></span>
              <span x-show="isActiveProfile(p)" class="text-success text-xs ml-2">✓</span>
            </button>
            <button @click="viewProfile(p.name)" class="px-2 py-2 text-sm text-fg-muted hover:text-fg shrink-0" :title="t('view_profile_title', [p.label||p.name])">👁️</button>
          </div>
        </template>
        <div x-show="profiles.length === 0" class="px-4 py-2 text-sm text-fg-muted" x-text="t('no_profiles')"></div>
      </div>
    </div>

    <!-- Terminal grid: every active session tiled at once -->
    <button @click="openTermGrid()" :disabled="actionLoading || sessions.items.length === 0"
      class="px-4 py-2 bg-bg-card border border-gray-700 hover:border-gray-600 rounded-xl text-sm font-medium transition-colors disabled:opacity-50">
      🖥️ <span x-text="t('term_grid')"></span>
    </button>

    <span x-show="actionLoading" class="text-sm text-fg-muted self-center animate-pulse" x-text="t('working')"></span>
  </div>
</header>

<!-- Main content -->
<main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

  <!-- Active sessions -->
  <section>
    <h2 class="text-sm font-semibold uppercase tracking-wider text-fg-muted mb-3" x-text="t('active_sessions')"></h2>
    <div x-show="sessions.loading" class="text-center py-4 text-fg-muted animate-pulse" x-text="t('loading')"></div>
    <div x-show="sessions.error" class="text-center py-4 text-danger" x-text="sessions.error"></div>
    <div x-show="!sessions.loading && sessions.items.length === 0" class="bg-bg-card rounded-xl border border-gray-800 p-6 text-center text-fg-muted">
      <p class="text-lg mb-1" x-text="t('no_sessions')"></p>
      <p class="text-sm" x-text="t('no_sessions_sub')"></p>
    </div>
    <div x-show="sessions.items.length > 0" class="space-y-2">
      <template x-for="s in sessions.items" :key="s.name">
        <div class="bg-bg-card rounded-xl border border-gray-800 p-4 flex items-center justify-between gap-3 group hover:border-gray-700 transition-colors">
          <div class="flex-1 min-w-0 cursor-pointer" @click="openLive(s)">
            <div class="flex items-center gap-2 text-sm">
              <span class="text-accent font-mono" x-text="t('session_label', [s.name])"></span>
              <span class="w-2 h-2 rounded-full" :class="s.status === 'rc_connected' ? 'bg-success' : 'bg-warn'" :title="s.status"></span>
              <span x-show="s.project" class="text-xs px-2 py-0.5 rounded bg-accent/10 text-accent font-mono" :title="s.project" x-text="projectLabel(s.project)"></span>
            </div>
            <p class="text-sm text-fg-muted truncate mt-0.5" x-text="s.task || t('no_task')"></p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button @click="openLive(s)" class="text-xs text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors" :title="t('live_view')">👁️</button>
            <button @click="copyAttach(s)" class="text-xs text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors" :title="t('copy_attach')">🔗</button>
            <button @click="openRename(s)" class="text-xs text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors" :title="t('rename')">✏️</button>
            <button @click="killSession(s)" class="text-xs text-fg-muted hover:text-danger px-2 py-1 rounded hover:bg-bg-hover transition-colors" :title="t('close_session')">🗄️</button>
          </div>
        </div>
      </template>
    </div>
  </section>

  <!-- Conversations -->
  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-fg-muted" x-text="t('conversations')"></h2>
      <div class="flex items-center gap-2">
        <button @click="viewMode = (viewMode === 'list' ? 'cards' : 'list')"
          class="text-sm text-fg-muted hover:text-fg px-2 py-1 rounded hover:bg-bg-hover transition-colors"
          x-text="viewMode === 'list' ? t('switch_cards') : t('switch_list')"></button>
      </div>
    </div>

    <!-- Search -->
    <div class="mb-3">
      <input type="search" x-model="convSearch" @input.debounce.300ms="loadConversations()"
        :placeholder="'🔍 ' + t('search_conv')"
        class="w-full bg-bg-card border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-fg placeholder:text-fg-muted focus:outline-none focus:border-accent transition-colors">
    </div>

    <!-- Advanced filters -->
    <div class="mb-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
      <select x-model="convFilters.origin" @change="applyConvFilters()"
        class="bg-bg-card border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-fg focus:outline-none focus:border-accent">
        <option value="" x-text="t('conv_origin_all')"></option>
        <option value="pi">pi</option>
        <option value="pc">pc</option>
        <option value="?">?</option>
      </select>
      <input type="date" x-model="convFilters.from" @change="applyConvFilters()"
        :title="t('conv_from')"
        class="bg-bg-card border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-fg focus:outline-none focus:border-accent">
      <input type="date" x-model="convFilters.to" @change="applyConvFilters()"
        :title="t('conv_to')"
        class="bg-bg-card border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-fg focus:outline-none focus:border-accent">
      <label class="flex items-center justify-center gap-2 text-xs text-fg-muted cursor-pointer">
        <input type="checkbox" x-model="convFilters.alive" @change="applyConvFilters()" class="accent-accent">
        <span x-text="t('conv_alive')"></span>
      </label>
    </div>

    <!-- List view -->
    <div x-show="viewMode === 'list'" class="space-y-2">
      <div x-show="conversations.error" class="text-center py-4 text-danger" x-text="conversations.error"></div>
      <div x-show="conversations.loading" class="text-center py-4 text-fg-muted animate-pulse" x-text="t('searching')"></div>
      <div x-show="!conversations.loading && conversations.items.length === 0" class="text-center py-8 text-fg-muted">
        <p class="text-lg mb-1" x-text="t('no_conv')"></p>
        <p class="text-sm" x-text="convSearch ? t('no_conv_search') : t('no_conv_empty')"></p>
      </div>
      <template x-for="c in conversations.items" :key="c.id">
        <div class="bg-bg-card rounded-xl border border-gray-800 p-4 hover:border-gray-700 transition-colors">
          <div class="flex items-center gap-2 text-xs text-fg-muted mb-1">
            <span x-text="c.date"></span>
            <span>·</span>
            <span class="px-1.5 py-0.5 rounded-full text-xs" :class="c.origin === 'pi' ? 'bg-accent/20 text-accent' : 'bg-gray-700 text-gray-400'" x-text="'[' + (c.origin || '?') + ']'"></span>
            <span x-show="c.is_alive" class="w-2 h-2 rounded-full bg-success" :title="t('alive')"></span>
          </div>
          <p class="text-sm font-medium truncate" x-text="c.title ? c.title : (c.preview || t('empty_conv'))"></p>
          <p class="text-xs text-fg-muted truncate" x-show="c.title" x-text="c.preview"></p>
          <div class="flex flex-wrap gap-1 mt-1" x-show="(c.tags || []).length">
            <template x-for="tag in (c.tags || [])" :key="tag">
              <span class="px-1.5 py-0.5 rounded-full text-xs bg-accent/20 text-accent" x-text="tag"></span>
            </template>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <button @click="resumeSession(c.id)" :disabled="actionLoading" class="text-xs text-accent hover:text-accent-hover font-medium disabled:opacity-50 disabled:cursor-wait" x-text="'▶ ' + t('resume')"></button>
            <button @click="previewConversation(c)" class="text-xs text-fg-muted hover:text-fg" x-text="'👁 ' + t('preview')"></button>
            <button @click="togglePinned(c)" class="text-xs" :class="c.pinned ? 'text-warn' : 'text-fg-muted hover:text-fg'" :title="c.pinned ? t('unpin') : t('pin')" x-text="c.pinned ? '📌' : '📍'"></button>
            <button @click="toggleArchived(c)" x-show="!c.is_alive" class="text-xs text-fg-muted hover:text-fg" :title="t('archive')">🗄</button>
            <a :href="'/api/conversations/' + c.id + '/export?format=txt'" :title="t('export_conv')" class="text-xs text-fg-muted hover:text-fg ml-auto">⬇</a>
          </div>
        </div>
      </template>
      <!-- Scrolling near here loads the next page (convInfiniteScroll in
           app.js) — no tap-to-load-more button on a touch list. -->
      <div x-show="conversations.hasMore" x-ref="convSentinelList" class="text-center py-3 text-xs text-fg-muted">
        <span x-show="conversations.loading" class="animate-pulse" x-text="t('loading_more')"></span>
        <span x-show="!conversations.loading" x-text="t('scroll_for_more')"></span>
      </div>
    </div>

    <!-- Card view -->
    <div x-show="viewMode === 'cards'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <div x-show="conversations.loading" class="col-span-full text-center py-4 text-fg-muted animate-pulse" x-text="t('searching')"></div>
      <div x-show="!conversations.loading && conversations.items.length === 0" class="col-span-full text-center py-8 text-fg-muted">
        <p class="text-lg mb-1" x-text="t('no_conv')"></p>
        <p class="text-sm" x-text="convSearch ? t('no_conv_search') : t('no_conv_empty')"></p>
      </div>
      <template x-for="c in conversations.items" :key="c.id">
        <div class="bg-bg-card rounded-xl border border-gray-800 p-4 hover:border-gray-700 transition-colors flex flex-col">
          <div class="flex items-center gap-2 text-xs text-fg-muted mb-2">
            <span x-text="c.date"></span>
            <span class="px-1.5 py-0.5 rounded-full text-xs" :class="c.origin === 'pi' ? 'bg-accent/20 text-accent' : 'bg-gray-700 text-gray-400'" x-text="'[' + (c.origin || '?') + ']'"></span>
            <span x-show="c.is_alive" class="w-2 h-2 rounded-full bg-success ml-auto" :title="t('alive')"></span>
          </div>
          <p class="text-sm font-medium truncate" x-show="c.title" x-text="c.title"></p>
          <p class="text-sm flex-1 line-clamp-3" x-text="c.preview || t('empty_conv')"></p>
          <div class="flex flex-wrap gap-1 mt-1" x-show="(c.tags || []).length">
            <template x-for="tag in (c.tags || [])" :key="tag">
              <span class="px-1.5 py-0.5 rounded-full text-xs bg-accent/20 text-accent" x-text="tag"></span>
            </template>
          </div>
          <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-800">
            <button @click="resumeSession(c.id)" :disabled="actionLoading" class="text-xs text-accent hover:text-accent-hover font-medium disabled:opacity-50 disabled:cursor-wait" x-text="'▶ ' + t('resume')"></button>
            <button @click="previewConversation(c)" class="text-xs text-fg-muted hover:text-fg" x-text="'👁 ' + t('preview')"></button>
            <button @click="togglePinned(c)" class="text-xs" :class="c.pinned ? 'text-warn' : 'text-fg-muted hover:text-fg'" :title="c.pinned ? t('unpin') : t('pin')" x-text="c.pinned ? '📌' : '📍'"></button>
            <button @click="toggleArchived(c)" x-show="!c.is_alive" class="text-xs text-fg-muted hover:text-fg" :title="t('archive')">🗄</button>
            <a :href="'/api/conversations/' + c.id + '/export?format=txt'" :title="t('export_conv')" class="text-xs text-fg-muted hover:text-fg ml-auto">⬇</a>
          </div>
        </div>
      </template>
      <div x-show="conversations.hasMore" x-ref="convSentinelCards" class="col-span-full text-center py-3 text-xs text-fg-muted">
        <span x-show="conversations.loading" class="animate-pulse" x-text="t('loading_more')"></span>
        <span x-show="!conversations.loading" x-text="t('scroll_for_more')"></span>
      </div>
    </div>
  </section>
</main>

<!-- Settings modal -->
<div x-show="settings.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-[90] p-4" @click.self="settings.open = false">
  <div class="flex flex-col w-full max-w-2xl max-h-[90vh] bg-bg-card border border-gray-700 rounded-2xl">
    <div class="flex items-center justify-between p-4 border-b border-gray-800 shrink-0">
      <h3 class="font-semibold" x-text="t('cfg_title')"></h3>
      <button @click="settings.open = false" class="text-fg-muted hover:text-fg text-xl leading-none">&times;</button>
    </div>
    <div class="overflow-y-auto p-6" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">

    <div x-show="settings.loading" class="text-center py-6 text-fg-muted animate-pulse" x-text="t('loading')"></div>

    <template x-for="group in settings.groups" :key="group.title">
      <div class="mb-5">
        <h4 class="text-xs font-semibold uppercase tracking-wider text-accent mb-2" x-text="group.title"></h4>
        <div class="bg-bg rounded-xl border border-gray-800 divide-y divide-gray-800">
          <template x-for="row in group.rows" :key="row.k">
            <div class="flex items-center justify-between gap-3 px-4 py-2.5">
              <span class="text-xs text-fg-muted w-32 shrink-0" x-text="row.k"></span>
              <template x-if="settings.editing !== row.field">
                <div class="flex items-center gap-2 flex-1 justify-end min-w-0">
                  <code class="text-sm text-fg truncate break-all" x-text="row.v"></code>
                  <button x-show="row.editable" @click="startEdit(row)" class="text-xs text-fg-muted hover:text-fg shrink-0" :title="t('cfg_edit')">✏️</button>
                  <button @click="copyText(row.v)" class="text-xs text-fg-muted hover:text-fg shrink-0" title="copy">📋</button>
                </div>
              </template>
              <template x-if="settings.editing === row.field">
                <div class="flex items-center gap-2 flex-1 justify-end min-w-0">
                  <input type="text" x-model="settings.editValue"
                    class="bg-bg border border-accent rounded-lg px-2 py-1 text-sm text-fg w-full max-w-[300px] focus:outline-none">
                  <button @click="saveEdit(row)" class="text-xs text-success hover:text-fg shrink-0" :title="t('cfg_save')">💾</button>
                  <button @click="cancelEdit()" class="text-xs text-fg-muted hover:text-fg shrink-0" :title="t('cfg_cancel')">❌</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Voice section. Written by hand rather than generated by
         buildConfigGroups because these are choices (dropdowns, toggles), not
         the read-only key/value rows that generator produces. -->
    <!-- x-if, NOT x-show: x-show only toggles display, so Alpine keeps
         evaluating every child expression underneath it. With voiceForm still
         null (before /api/config answers) that is ~20 "reading 'mode' of null"
         errors per render, and a broken Alpine effect takes unrelated parts of
         the UI down with it. x-if keeps the subtree out of the DOM entirely. -->
    <template x-if="voiceForm">
    <div class="mb-5">
      <h4 class="text-xs font-semibold uppercase tracking-wider text-accent mb-2" x-text="t('cfg_voice')"></h4>
      <div class="bg-bg rounded-xl border border-gray-800 divide-y divide-gray-800">

        <label class="voice-setting">
          <span x-text="t('cfg_voice_enabled')"></span>
          <input type="checkbox" x-model="voiceForm.enabled">
        </label>

        <label class="voice-setting">
          <span x-text="t('cfg_voice_stt_mode')"></span>
          <select x-model="voiceForm.mode">
            <template x-for="m in voiceForm.modes" :key="m">
              <option :value="m" x-text="t('cfg_voice_mode_' + m)"></option>
            </template>
          </select>
        </label>

        <label class="voice-setting" x-show="voiceForm.mode !== 'webspeech'">
          <span x-text="t('cfg_voice_stt_provider')"></span>
          <select x-model="voiceForm.sttProvider">
            <option value=""></option>
            <template x-for="p in voiceForm.providers.filter(p => p.stt)" :key="p.name">
              <option :value="p.name" x-text="p.name"></option>
            </template>
          </select>
        </label>

        <label class="voice-setting" x-show="voiceForm.mode !== 'webspeech'">
          <span x-text="t('cfg_voice_vocabulary')"></span>
          <input type="text" x-model="voiceForm.vocabulary">
        </label>

        <label class="voice-setting">
          <span x-text="t('cfg_voice_rewrite_enabled')"></span>
          <input type="checkbox" x-model="voiceForm.rewriteEnabled">
        </label>

        <label class="voice-setting" x-show="voiceForm.rewriteEnabled">
          <span x-text="t('cfg_voice_rewrite_provider')"></span>
          <select x-model="voiceForm.rewriteProvider">
            <option value=""></option>
            <template x-for="p in voiceForm.providers.filter(p => p.chat)" :key="p.name">
              <option :value="p.name" x-text="p.name"></option>
            </template>
          </select>
        </label>

        <label class="voice-setting" x-show="voiceForm.rewriteEnabled">
          <span x-text="t('cfg_voice_rewrite_model')"></span>
          <input type="text" x-model="voiceForm.model">
        </label>

        <label class="voice-setting" x-show="voiceForm.rewriteEnabled">
          <span x-text="t('cfg_voice_default_role')"></span>
          <select x-model="voiceForm.defaultRole">
            <template x-for="r in voice.roles" :key="r.id">
              <option :value="r.id" x-text="lang === 'en' ? r.en : r.es"></option>
            </template>
          </select>
        </label>

        <label class="voice-setting" x-show="voiceForm.rewriteEnabled">
          <span x-text="t('cfg_voice_max_questions')"></span>
          <input type="number" min="0" max="10" x-model.number="voiceForm.maxQuestions">
        </label>

        <div class="voice-setting" x-show="!voiceForm.providers.length">
          <span class="text-warn" x-text="t('cfg_voice_no_providers')"></span>
        </div>

        <div class="flex items-center justify-between gap-2 px-4 py-2.5">
          <button @click="openPromptEditor()" class="text-sm text-accent hover:opacity-80 font-medium" x-text="t('cfg_voice_prompt_edit')"></button>
          <button @click="saveVoiceSettings()" class="bg-accent text-white rounded-xl px-3 py-1.5 text-xs font-medium hover:opacity-90 transition-opacity" x-text="t('cfg_save')"></button>
        </div>
      </div>
    </div>
    </template>

    <!-- Users section -->
    <div class="mb-5">
      <h4 class="text-xs font-semibold uppercase tracking-wider text-accent mb-2" x-text="t('cfg_users')"></h4>
      <div class="bg-bg rounded-xl border border-gray-800 divide-y divide-gray-800">
        <template x-for="u in settings.users" :key="u.username">
          <div class="flex items-center justify-between gap-3 px-4 py-2.5">
            <span class="text-sm text-fg flex items-center gap-2">
              <span x-text="u.username"></span>
              <span x-show="u.totp" class="text-[0.65rem] px-1.5 py-0.5 rounded bg-success/15 text-success" x-text="t('cfg_2fa_on')"></span>
            </span>
            <div class="flex items-center gap-1">
              <button @click="u.totp ? disableTotp(u.username) : openTotpEnroll(u.username)"
                class="text-xs text-fg-muted hover:text-fg px-2 py-1"
                :title="u.totp ? t('cfg_2fa_disable') : t('cfg_2fa_enable')" x-text="u.totp ? '🔓' : '🔐'"></button>
              <button @click="openChangePassword(u.username)" class="text-xs text-fg-muted hover:text-fg px-2 py-1" :title="t('cfg_chg_pass')">🔑</button>
              <button x-show="settings.users.length > 1" @click="deleteUser(u.username)" class="text-xs text-fg-muted hover:text-danger px-2 py-1" :title="t('cfg_del_user')">🗑️</button>
            </div>
          </div>
        </template>
        <div class="px-4 py-2.5">
          <button @click="openAddUser()" class="text-sm text-accent hover:text-accent-hover font-medium">+ <span x-text="t('cfg_add_user')"></span></button>
        </div>
      </div>
    </div>

    <div class="text-xs text-fg-muted border-t border-gray-800 pt-4 space-y-1">
      <p x-text="t('cfg_restart_note')"></p>
      <p x-text="t('cfg_secrets_note')"></p>
    </div>
  </div>
</div>
</div>

<!-- Audit modal -->
<div x-show="audit.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-[95] p-4" @click.self="audit.open = false">
  <div class="flex flex-col w-full max-w-2xl h-[80vh] bg-bg-card border border-gray-700 rounded-2xl">
    <div class="flex items-center justify-between p-4 border-b border-gray-800 shrink-0">
      <h3 class="font-semibold" x-text="t('audit_title')"></h3>
      <button @click="audit.open = false" class="text-fg-muted hover:text-fg text-xl leading-none">&times;</button>
    </div>
    <div class="p-3 border-b border-gray-800 flex items-center gap-2 shrink-0">
      <input @keyup.enter="loadAudit()" x-model="audit.q" type="text" :placeholder="t('audit_filter')"
        class="flex-1 bg-bg-hover border border-gray-700 rounded-xl px-3 py-2 text-sm outline-none focus:border-accent">

<!-- Metrics modal -->
<div x-show="metrics.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-[95] p-4" @click.self="metrics.open = false">
  <div class="flex flex-col w-full max-w-2xl h-[80vh] bg-bg-card border border-gray-700 rounded-2xl">
    <div class="flex items-center justify-between p-4 border-b border-gray-800 shrink-0">
      <h3 class="font-semibold" x-text="t('metrics_title')"></h3>
      <button @click="metrics.open = false" class="text-fg-muted hover:text-fg text-xl leading-none">&times;</button>
    </div>
    <div class="overflow-y-auto flex-1 p-4 space-y-5" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
      <div x-show="metrics.loading" class="text-center py-6 text-fg-muted animate-pulse" x-text="t('loading')"></div>
      <template x-if="!metrics.loading && metrics.data">
        <div class="space-y-5">
          <div class="flex gap-3 flex-wrap">
            <div class="bg-bg-hover/50 border border-gray-800 rounded-xl px-4 py-3">
              <div class="text-xs text-fg-muted" x-text="t('metrics_uptime')"></div>
              <div class="text-lg font-semibold" x-text="fmtUptime(metrics.data.uptime_s)"></div>
            </div>
            <div class="bg-bg-hover/50 border border-gray-800 rounded-xl px-4 py-3">
              <div class="text-xs text-fg-muted" x-text="t('metrics_ram')"></div>
              <div class="text-lg font-semibold" x-text="(metrics.data.ram_mb || 0) + ' MB'"></div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <select x-model="metrics.model" @change="loadMetrics()" class="bg-bg-hover/50 border border-gray-800 rounded-lg px-3 py-2 text-sm max-w-full">
              <option value="" x-text="t('metrics_all_models')"></option>
              <template x-for="bm in (metrics.data.token_usage_by_model || [])" :key="bm.model">
                <option :value="bm.model" x-text="bm.model"></option>
              </template>
            </select>
            <span class="flex-1"></span>
            <button @click="downloadMetrics('json')" class="text-xs px-3 py-2 bg-bg-hover/50 border border-gray-800 rounded-lg hover:bg-bg-hover" x-text="t('metrics_download_json')"></button>
            <button @click="downloadMetrics('csv')" class="text-xs px-3 py-2 bg-bg-hover/50 border border-gray-800 rounded-lg hover:bg-bg-hover" x-text="t('metrics_download_csv')"></button>
          </div>

          <div>
            <div class="text-sm font-semibold mb-2" x-text="t('metrics_sessions_day')"></div>
            <div x-show="maxBar(metrics.data.sessions_per_day, 'count') === 0" class="text-sm text-fg-muted" x-text="t('metrics_none')"></div>
            <div class="space-y-1">
              <template x-for="d in metrics.data.sessions_per_day" :key="d.date">
                <div class="flex items-center gap-2 text-xs">
                  <span class="w-20 shrink-0 text-fg-muted" x-text="d.date"></span>
                  <div class="flex-1 bg-bg-hover/50 rounded h-3 overflow-hidden">
                    <div class="h-full bg-accent/70 rounded" :style="'width:' + (maxBar(metrics.data.sessions_per_day, 'count') ? Math.round(d.count / maxBar(metrics.data.sessions_per_day, 'count') * 100) : 0) + '%'"></div>
                  </div>
                  <span class="w-6 text-right" x-text="d.count"></span>
                </div>
              </template>
            </div>
          </div>

          <div>
            <div class="text-sm font-semibold mb-2" x-text="t('metrics_profiles')"></div>
            <div x-show="!metrics.data.top_profiles.length" class="text-sm text-fg-muted" x-text="t('metrics_none')"></div>
            <div class="space-y-1">
              <template x-for="p in metrics.data.top_profiles" :key="p.name">
                <div class="flex items-center justify-between text-sm px-3 py-1.5 bg-bg-hover/50 border border-gray-800 rounded-lg">
                  <span x-text="p.name"></span>
                  <span class="text-fg-muted text-xs" x-text="p.count"></span>
                </div>
              </template>
            </div>
          </div>

          <div>
            <div class="text-sm font-semibold mb-2" x-text="t('metrics_tokens')"></div>
            <div x-show="maxBar(metrics.data.token_usage_per_day, 'input') === 0 && maxBar(metrics.data.token_usage_per_day, 'output') === 0 && maxBar(metrics.data.token_usage_per_day, 'cache') === 0" class="text-sm text-fg-muted" x-text="t('metrics_none')"></div>
            <div class="space-y-1">
              <template x-for="d in metrics.data.token_usage_per_day" :key="d.date">
                <div class="flex items-center gap-2 text-xs" x-show="d.input || d.output || d.cache">
                  <span class="w-20 shrink-0 text-fg-muted" x-text="d.date"></span>
                  <div class="flex-1 flex h-3 rounded overflow-hidden bg-bg-hover/50">
                    <div class="bg-accent/70" :style="'width:' + Math.round(d.input / Math.max(maxBar(metrics.data.token_usage_per_day, 'input'), maxBar(metrics.data.token_usage_per_day, 'output'), maxBar(metrics.data.token_usage_per_day, 'cache')) * 100) + '%'" :title="t('metrics_input') + ' ' + d.input"></div>
                    <div class="bg-success/70" :style="'width:' + Math.round(d.output / Math.max(maxBar(metrics.data.token_usage_per_day, 'input'), maxBar(metrics.data.token_usage_per_day, 'output'), maxBar(metrics.data.token_usage_per_day, 'cache')) * 100) + '%'" :title="t('metrics_output') + ' ' + d.output"></div>
                    <div class="bg-warn/70" :style="'width:' + Math.round(d.cache / Math.max(maxBar(metrics.data.token_usage_per_day, 'input'), maxBar(metrics.data.token_usage_per_day, 'output'), maxBar(metrics.data.token_usage_per_day, 'cache')) * 100) + '%'" :title="t('metrics_cache') + ' ' + d.cache"></div>
                  </div>
                  <span class="text-fg-muted w-28 text-right shrink-0" x-text="d.input + ' / ' + d.output + ' / ' + d.cache"></span>
                </div>
              </template>
            </div>
          </div>

          <div>
            <div class="text-sm font-semibold mb-2" x-text="t('metrics_by_model')"></div>
            <div x-show="!(metrics.data.token_usage_by_model || []).length" class="text-sm text-fg-muted" x-text="t('metrics_none')"></div>
            <div class="space-y-1">
              <template x-for="bm in (metrics.data.token_usage_by_model || [])" :key="bm.model">
                <div class="flex items-center justify-between text-sm px-3 py-1.5 bg-bg-hover/50 border border-gray-800 rounded-lg">
                  <span x-text="bm.model"></span>
                  <span class="text-fg-muted text-xs" x-text="bm.messages + ' msg · ' + fmtTokens(bm.input + bm.output + bm.cache) + ' tok'"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- Live view modal: Terminal + Chat -->
<div x-show="live.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-[95] p-4" @click.self="closeLive()">
  <div class="flex flex-col w-full max-w-3xl h-[80vh] bg-bg-card border border-gray-700 rounded-2xl overflow-hidden" :style="'height:min(80vh,80dvh,' + (live.maxH || 10000) + 'px)'">
    <div class="flex items-center justify-between p-4 border-b border-gray-800 shrink-0">
      <div class="flex items-center gap-3">
        <h3 class="font-semibold" x-text="t('live_title', [live.name])"></h3>
        <div class="flex rounded-lg bg-bg p-0.5 text-xs">
          <button @click="setLiveView('chat')" :class="live.view==='chat' ? 'bg-accent text-white' : 'text-fg-muted hover:text-fg'" class="px-3 py-1 rounded-md transition-colors" x-text="t('live_tab_chat')"></button>
          <button @click="setLiveView('term')" :class="live.view==='term' ? 'bg-accent text-white' : 'text-fg-muted hover:text-fg'" class="px-3 py-1 rounded-md transition-colors" x-text="t('live_tab_term')"></button>
        </div>
      </div>
      <button @click="closeLive()" class="text-fg-muted hover:text-fg text-xl leading-none">&times;</button>
    </div>

    <!-- Controls: scroll / mode / model / interrupt (works on both tabs) -->
    <div class="flex items-center gap-1 px-3 py-2 border-b border-gray-800 shrink-0 flex-wrap">
      <button @click="scrollLive(-1)" :title="t('live_scroll_up')" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors">⏶</button>
      <button @click="scrollLive(1)" :title="t('live_scroll_end')" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors">⏬</button>
      <select @change="setMode($event.target.value); $event.target.value=''" :title="t('mode_label')" class="px-2 py-1 rounded border border-gray-700 bg-bg-card text-fg text-xs focus:outline-none focus:border-accent transition-colors">
        <option value="" selected disabled x-text="t('mode_label')"></option>
        <template x-for="m in modeOptions()" :key="m">
          <option :value="m" x-text="m"></option>
        </template>
      </select>
      <select @change="setModel($event.target.value); $event.target.value=''" :title="t('model_label')" class="px-2 py-1 rounded border border-gray-700 bg-bg-card text-fg text-xs focus:outline-none focus:border-accent transition-colors max-w-[160px]">
        <option value="" selected disabled x-text="t('model_label')"></option>
        <template x-for="mo in live.models" :key="mo">
          <option :value="mo" x-text="mo"></option>
        </template>
      </select>
      <span class="flex-1"></span>
    </div>

    <!-- Terminal tab -->
    <template x-if="live.view==='term'">
      <div class="flex-1 overflow-y-auto min-h-0 tgrid-pane" x-ref="livePane" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
        <div x-show="live.status" class="px-3 py-2 text-xs text-danger" x-text="live.status"></div>
        <pre class="p-3 font-mono text-xs leading-relaxed whitespace-pre-wrap break-words" x-text="termText"></pre>
      </div>
    </template>

    <!-- Chat tab -->
    <template x-if="live.view==='chat'">
      <div class="flex flex-col flex-1 min-h-0">
        <div class="flex-1 overflow-y-auto p-4 space-y-3" x-ref="liveChat" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
          <div x-show="live.chatStatus" class="text-xs text-danger px-1" x-text="live.chatStatus"></div>
          <div x-show="!live.meta || !live.meta.ready" class="text-sm text-fg-muted text-center py-10" x-text="t('chat_no_conv')"></div>
          <template x-for="m in live.msgs" :key="m.index">
            <div :class="m.role==='user' ? 'flex justify-end' : 'flex justify-start'">
              <div :class="m.role==='user' ? 'max-w-[80%] bg-accent text-white rounded-2xl rounded-br-md px-3 py-2 text-sm whitespace-pre-wrap break-words' : 'max-w-[85%] bg-bg border border-gray-800 rounded-2xl rounded-bl-md px-3 py-2 text-sm whitespace-pre-wrap break-words text-fg'"><span x-text="m.content"></span></div>
            </div>
          </template>
        </div>

        <!-- AskUserQuestion choice dialog: question + selectable options.
             x-if (not x-show) so the subtree is not evaluated while hidden:
             when live.meta.choice is null the inner bindings would throw. -->
        <template x-if="live.meta && live.meta.waiting === 'choice' && live.meta.choice">
          <div class="px-4 py-3 border-t border-gray-800 bg-bg/60 shrink-0 space-y-2">
            <div class="text-sm text-fg" x-text="live.meta.choice.question"></div>
            <div class="flex flex-col gap-1">
              <template x-for="(opt, i) in live.meta.choice.options" :key="i">
                <button @click="selectChoice(i)" :class="i === live.meta.choice.selected ? 'bg-warn/15 border-warn/40 text-fg' : 'border-gray-700 text-fg-muted hover:bg-bg-hover'"
                  class="text-left px-3 py-1.5 rounded border text-xs transition-colors flex items-center gap-2"
                  :title="t('chat_choice_title')">
                  <span x-text="(i === live.meta.choice.selected ? '❯ ' : '  ') + (i + 1) + '.'"></span>
                  <span x-text="opt"></span>
                </button>
              </template>
            </div>
            <div class="flex items-center gap-1 text-xs text-fg-muted">
              <button @click="sendKey('up')" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors" :title="t('chat_choice_up')">↑</button>
              <button @click="sendKey('down')" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors" :title="t('chat_choice_down')">↓</button>
              <span class="text-xs" x-text="t('chat_choice_hint')"></span>
            </div>
          </div>
        </template>

        <!-- Status chrome (modo / tiempo / vivo), never as text -->
        <div class="px-4 py-2 border-t border-gray-800 flex items-center gap-3 text-xs text-fg-muted shrink-0">
          <span x-show="live.meta && live.meta.is_alive" class="text-success">● <span x-text="t('chat_status_alive')"></span></span>
          <span x-show="live.meta && !live.meta.is_alive" class="text-danger">● <span x-text="t('chat_status_off')"></span></span>
          <span x-show="live.meta && live.meta.waiting === 'approval'" class="text-warn font-medium">⚠ <span x-text="t('chat_status_waiting')"></span></span>
          <span x-show="live.meta && live.meta.waiting === 'choice'" class="text-warn font-medium">⚠ <span x-text="t('chat_status_choice')"></span></span>
          <span x-show="live.meta && live.meta.waiting === 'setup'" class="text-warn font-medium">⚠ <span x-text="t('chat_status_setup')"></span></span>
          <span x-show="live.meta && live.meta.mode" x-text="live.meta && live.meta.mode ? t('chat_status_mode', [live.meta.mode]) : ''"></span>
          <span x-show="live.meta && live.meta.model" x-text="live.meta && live.meta.model ? t('chat_status_model', [live.meta.model]) : ''"></span>
          <span x-show="live.meta && live.meta.created" x-text="t('chat_status_elapsed', [live.elapsed])"></span>
          <span class="ml-auto"></span>
          <button x-show="live.meta && live.meta.is_alive" @click="reconnectRC()"
            class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors"
            :title="t('rc_reconnect_title')"
            x-text="live.meta && live.meta.status === 'rc_connected' ? t('rc_reconnect_on') : t('rc_reconnect_off')"></button>
          <!-- Choice dialog (AskUserQuestion): navigate with ↑/↓, pick with Enter. -->
          <template x-if="live.meta && live.meta.is_alive && live.meta.waiting === 'choice'">
            <span class="flex items-center gap-1">
              <button @click="sendKey('up')" class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors" :title="t('chat_choice_up')">↑</button>
              <button @click="sendKey('down')" class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors" :title="t('chat_choice_down')">↓</button>
              <button @click="sendKey('enter')" class="shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover transition-colors" :title="t('chat_choice_title')">✓ <span x-text="t('chat_approve')"></span></button>
            </span>
          </template>
          <!-- Approve the permission dialog (option 1 / Enter) when the pane is
               blocked waiting for approval. -->
          <button x-show="live.meta && live.meta.is_alive && live.meta.waiting === 'approval'" @click="sendKey('enter')"
            class="shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover transition-colors"
            :title="t('chat_approve_title')">✓ <span x-text="t('chat_approve')"></span></button>
          <!-- Auto-mode setup wizard: Enter only toggles its focused checkbox,
               it never confirms, so the only working dismissal is Escape. -->
          <button x-show="live.meta && live.meta.is_alive && live.meta.waiting === 'setup'" @click="sendKey('escape')"
            class="shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover transition-colors"
            :title="t('chat_skip_title')">⏭ <span x-text="t('chat_skip')"></span></button>
          <!-- Stop: sends Escape, which always works (interrupts generation and
               cancels dialogs/permissions). Bottom bar, right of re-register. -->
          <button x-show="live.meta && live.meta.is_alive" @click="sendKey('escape')"
            class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors"
            :title="t('chat_stop_title')">⏹</button>
        </div>

        <!-- Processing indicator (chat view only): animated dots + the live
             status word from the pane (noodling…/pondering…/…) while the
             assistant works. Waiting dialogs have their own UI, so this stays
             hidden then. -->
        <div x-show="chatWorking()" x-transition:enter="transition-opacity duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="px-4 pb-2 -mt-1 flex items-center gap-2 text-xs text-fg-muted shrink-0">
          <span class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span x-text="live.meta && live.meta.status_text ? live.meta.status_text : ''"></span>
        </div>

        <!-- Input bar -->
        <div class="p-3 border-t border-gray-800 flex items-end gap-2 shrink-0">
          <!-- Dictate: records, transcribes AND rewrites in one action, then
               opens the review panel. There is deliberately no transcribe-only
               mode. -->
          <button x-show="canDictate()" @click="toggleVoice('chat')" :disabled="!!voice.stage && !voice.recording"
            :title="voice.recording ? t('voice_dictate_stop') : t('voice_dictate')"
            :class="voice.recording ? 'shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn transition-colors voice-recording' : 'shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors'"
            x-text="voice.recording ? '⏺' : '🎤'"></button>
          <!-- Rewrite only: works on whatever is already in the input, so it
               needs no microphone and works in every browser. -->
          <button x-show="canRewrite()" @click="runRewrite('chat')" :disabled="!!voice.stage"
            :title="t('voice_rewrite')"
            class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg transition-colors disabled:opacity-50">✨</button>
          <textarea x-model="live.input" rows="1" @keydown.enter="onChatKeydown($event)" @input="autoGrow($event.target)" :placeholder="t('chat_placeholder')"
            class="flex-1 bg-bg border border-gray-700 rounded-xl px-3 py-2 text-sm text-fg placeholder:text-fg-muted focus:outline-none focus:border-accent transition-colors resize-none max-h-32"></textarea>
          <button @click="sendChat()" :disabled="live.sending" class="shrink-0 bg-accent text-white rounded-xl px-4 py-2 text-sm font-medium hover:opacity-90 disabled:opacity-50 transition-opacity" x-text="t('chat_send')"></button>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- Terminal grid: every active session tiled at once.
     Sits after the live modal in the DOM (same z-95 tier) so it paints above
     it, but before the toast so toasts stay visible. -->
<div x-show="grid.open" x-cloak class="fixed inset-0 bg-bg z-[95] flex flex-col tgrid-overlay"
  @keydown.escape.window="if (grid.open && grid.zoomed) grid.zoomed = null">

  <!-- Header: title, minimized-tile chips (kept in this bar so they don't eat
       an extra row of grid space), close button. Wraps if there are many. -->
  <div class="flex items-center justify-between gap-3 flex-wrap px-4 py-3 border-b border-gray-800 shrink-0">
    <div class="flex items-center gap-2 flex-wrap">
      <h3 class="font-semibold shrink-0" x-text="t('term_grid_title', [Object.keys(grid.tiles).length])"></h3>
      <template x-for="name in minimizedTileNames()" :key="'min-' + name">
        <button @click="restoreTile(name)" :title="t('term_tile_restore')"
          class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-bg-card border border-gray-700 hover:border-gray-600 text-xs transition-colors">
          <span class="w-2 h-2 rounded-full" :class="tileRcConnected(name) ? 'bg-success' : 'bg-warn'"></span>
          <span class="font-mono" x-text="name"></span>
          <span class="text-fg-muted">⤢</span>
        </button>
      </template>
    </div>
    <button @click="closeTermGrid()" class="text-fg-muted hover:text-fg text-xl leading-none shrink-0">&times;</button>
  </div>

  <div class="flex flex-col flex-1 min-h-0 p-3 gap-3">

    <div x-show="Object.keys(grid.tiles).length === 0" class="flex-1 flex items-center justify-center text-fg-muted text-sm"
      x-text="t('term_grid_empty')"></div>

    <!-- Narrow screens (grid.narrow, see app.js): every tile starts minimized
         and only one is ever shown at a time, so this hint fills the gap
         until the user picks one from the header chips. -->
    <div x-show="grid.narrow && Object.keys(grid.tiles).length > 0 && visibleTileNames().length === 0"
      class="flex-1 flex items-center justify-center p-6 text-center text-fg-muted text-sm"
      x-text="t('term_grid_pick')"></div>

    <!-- Tiles packed into near-square rows (tileRows(), see app.js) so an
         incomplete row never leaves a dead gap. Hidden (not unmounted) while
         another tile is zoomed, so every stream keeps running and coming back
         is instant. -->
    <div class="tgrid flex-1 min-h-0">
      <template x-for="(row, ri) in tileRows()" :key="'row-' + ri + '-' + row.join(',')">
        <div class="tgrid-row">
      <template x-for="name in row" :key="'tile-' + name">
        <!-- x-if (not x-show): a tile can be removed from grid.tiles (session
             killed, closeTermGrid) between renders, and unlike x-show the
             subtree here is not evaluated at all while the guard is false —
             same reasoning as the choice-picker guard below. -->
        <template x-if="grid.tiles[name]">
        <div class="tgrid-tile flex flex-col min-h-0 bg-bg-card border border-gray-800 rounded-xl overflow-hidden"
          :class="grid.zoomed === name ? 'tgrid-zoomed' : (grid.zoomed ? 'tgrid-hidden' : '')">

          <!-- Tile header: kept to this one row (mode/model included) so tiles
               never grow taller than the icon-button strip; a narrow tile
               scrolls this row horizontally instead of wrapping to a 2nd line.
               tgrid-tile-header tightens gap/padding below 1024px (terminal-grid.css)
               so the two scroll buttons + the rest still fit one mobile-width
               tile without needing that scroll. -->
          <div class="tgrid-tile-header flex items-center gap-2 px-3 py-2 border-b border-gray-800 shrink-0 overflow-x-auto">
            <span class="w-2 h-2 rounded-full shrink-0" :class="tileRcConnected(name) ? 'bg-success' : 'bg-warn'"></span>
            <span class="tgrid-tile-name font-mono text-sm shrink-0" x-text="name" :title="name"></span>
            <select @change="setTileMode(name, $event.target.value); $event.target.value=''"
              :title="t('mode_label')" class="tgrid-select shrink-0">
              <option value="" selected disabled x-text="t('mode_label')"></option>
              <template x-for="m in tileModeOptions(name)" :key="m">
                <option :value="m" :selected="grid.tiles[name].meta && grid.tiles[name].meta.mode === m" x-text="m"></option>
              </template>
            </select>
            <select @change="setTileModel(name, $event.target.value); $event.target.value=''"
              :title="t('model_label')" class="tgrid-select shrink-0">
              <option value="" selected disabled x-text="t('model_label')"></option>
              <template x-for="mo in live.models" :key="mo">
                <option :value="mo" :selected="grid.tiles[name].meta && grid.tiles[name].meta.model === mo" x-text="mo"></option>
              </template>
            </select>
            <span class="flex-1"></span>
            <button @click="scrollTilePane(name, -1)" :title="t('live_scroll_up')"
              class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">⏶</button>
            <button @click="scrollTilePane(name, 1)" :title="t('live_scroll_end')"
              class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">⏬</button>
            <button @click="sendTileKey(name, 'ctrl-o')" :title="t('term_tile_output')"
              class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">⌄</button>
            <!-- Zoom is meaningless when the grid can only ever show one tile
                 (grid.narrow, see restoreTile in app.js): there's nothing to
                 zoom OUT of. -->
            <button x-show="!grid.narrow" @click="toggleTileZoom(name)" :title="grid.zoomed === name ? t('term_tile_unzoom') : t('term_tile_zoom')"
              class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors"
              x-text="grid.zoomed === name ? '⧉' : '⛶'"></button>
            <button @click="minimizeTile(name)" :title="t('term_tile_minimize')"
              class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">–</button>
          </div>

          <!-- Raw pane, ANSI-coloured. Same look as the single-session Terminal tab. -->
          <div class="flex-1 overflow-y-auto min-h-0 tgrid-pane" :id="'tile-pane-' + name"
            style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
            <div x-show="grid.tiles[name].status" class="px-3 py-2 text-xs text-danger" x-text="grid.tiles[name].status"></div>
            <pre class="p-3 font-mono text-xs leading-relaxed whitespace-pre-wrap break-words"><code x-html="tileText(name)"></code></pre>
          </div>

          <!-- Approval / choice: the extra value CCSM adds on top of the raw pane -->
          <template x-if="grid.tiles[name].meta && grid.tiles[name].meta.waiting === 'choice' && grid.tiles[name].meta.choice">
            <div class="shrink-0 px-3 py-2 border-t border-gray-800 bg-warn/5">
              <div class="text-xs text-fg mb-1" x-text="grid.tiles[name].meta.choice.question"></div>
              <div class="flex flex-wrap gap-1">
                <!-- Options are buttons, not spans: clicking one must post its
                     own {choice: i} (selectTileChoice) so the host navigates the
                     real picker there and confirms it — the tile's mirror of
                     the live modal's selectChoice. Before this, a tile option
                     had no click handler at all (spans), so "responder con las
                     opciones" in Modo terminal silently did nothing. -->
                <template x-for="(opt, i) in grid.tiles[name].meta.choice.options" :key="i">
                  <button @click="selectTileChoice(name, i)" :title="t('chat_choice_title')"
                    class="text-xs px-2 py-1 rounded border transition-colors text-left"
                    :class="i === grid.tiles[name].meta.choice.selected ? 'bg-warn/15 border-warn/40 text-fg' : 'border-gray-700 text-fg-muted hover:bg-bg-hover hover:text-fg'">
                    <span x-text="(i === grid.tiles[name].meta.choice.selected ? '❯ ' : '  ') + (i + 1) + '. ' + opt"></span>
                  </button>
                </template>
              </div>
              <div class="flex gap-1 mt-2">
                <button @click="sendTileKey(name, 'up')" :title="t('chat_choice_up')"
                  class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">↑</button>
                <button @click="sendTileKey(name, 'down')" :title="t('chat_choice_down')"
                  class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">↓</button>
                <button @click="sendTileKey(name, 'enter')" :title="t('chat_choice_title')"
                  class="px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover text-xs transition-colors">✓ <span x-text="t('chat_approve')"></span></button>
              </div>
            </div>
          </template>

          <!-- Terminal prompt: a real input, not a chat bubble -->
          <div class="shrink-0 flex items-center gap-2 px-3 py-2 border-t border-gray-800">
            <span x-show="grid.tiles[name].meta && grid.tiles[name].meta.waiting === 'approval'" class="text-warn text-xs shrink-0">⚠</span>
            <button x-show="grid.tiles[name].meta && grid.tiles[name].meta.waiting === 'approval'"
              @click="sendTileKey(name, 'enter')" :title="t('chat_approve_title')"
              class="shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover text-xs transition-colors">✓ <span x-text="t('chat_approve')"></span></button>
            <!-- Auto-mode setup wizard: Enter only toggles its focused checkbox,
                 it never confirms, so the only working dismissal is Escape. -->
            <span x-show="grid.tiles[name].meta && grid.tiles[name].meta.waiting === 'setup'" class="text-warn text-xs shrink-0">⚠</span>
            <button x-show="grid.tiles[name].meta && grid.tiles[name].meta.waiting === 'setup'"
              @click="sendTileKey(name, 'escape')" :title="t('chat_skip_title')"
              class="shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn hover:bg-bg-hover text-xs transition-colors">⏭ <span x-text="t('chat_skip')"></span></button>
            <span class="text-accent font-mono text-sm shrink-0">❯</span>
            <textarea x-model="grid.tiles[name].input" rows="1" :placeholder="t('term_tile_prompt')"
              @keydown.enter="onTileKeydown($event, name)" :disabled="grid.tiles[name].sending"
              class="flex-1 min-w-0 font-mono tgrid-input disabled:opacity-50"></textarea>
            <button x-show="canDictate()" @click="toggleVoice(name)" :disabled="!!voice.stage && !voice.recording"
              :title="voice.recording ? t('voice_dictate_stop') : t('voice_dictate')"
              :class="voice.recording && voice.target === name ? 'shrink-0 px-2 py-1 rounded border border-gray-700 bg-warn/15 text-warn text-xs transition-colors voice-recording' : 'shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors'"
              x-text="voice.recording && voice.target === name ? '⏺' : '🎤'"></button>
            <button x-show="canRewrite()" @click="runRewrite(name)" :disabled="!!voice.stage" :title="t('voice_rewrite')"
              class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors disabled:opacity-50">✨</button>
            <button @click="sendTileKey(name, 'escape')" :title="t('chat_stop_title')"
              class="shrink-0 px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors">⏹</button>
          </div>
        </div>
        </template>
      </template>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- Toast notifications -->
<!-- Review panel: where 🎤 and ✨ both land.
     Above the live chat and the terminal grid (both z-95) because it is opened
     from inside them. Registered in setBodyLock so an iOS swipe inside the
     textarea cannot drag it off screen. -->
<div x-show="compose.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center voice-overlay p-4" @click.self="closeCompose()">
  <div class="voice-compose-panel flex flex-col w-full max-w-3xl max-h-[92vh] bg-bg-card border border-gray-700 rounded-2xl">

    <div class="flex items-center justify-between gap-2 p-3 border-b border-gray-800 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-sm font-semibold shrink-0" x-text="t('compose_title')"></span>
        <span class="text-xs text-fg-muted truncate" x-text="composeSession()"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <!-- Role lives here, not next to the buttons: the tile bar has no room
             for it, and this is where changing it is useful — pick a role and
             press Retry. -->
        <span class="text-xs text-fg-muted" x-text="t('compose_role')"></span>
        <select x-model="compose.role" class="tgrid-select">
          <template x-for="r in voice.roles" :key="r.id">
            <option :value="r.id" x-text="lang === 'en' ? r.en : r.es"></option>
          </template>
        </select>
        <span x-show="compose.detected && compose.role === 'auto'" class="text-[0.65rem] px-1.5 py-0.5 rounded bg-success/15 text-success"
          x-text="roleLabel(compose.detected) + ' · ' + t('compose_role_auto_detected')"></span>
        <button @click="closeCompose()" class="text-fg-muted hover:text-fg text-xl leading-none px-1">&times;</button>
      </div>
    </div>

    <!-- Clarifying questions. Optional by design: the prompt below is already
         usable, so answering is an improvement rather than a gate. -->
    <div x-show="compose.questions.length" class="px-4 py-3 border-b border-gray-800 bg-bg shrink-0">
      <p class="text-xs font-semibold text-warn mb-1" x-text="t('compose_questions_title')"></p>
      <template x-for="(q, i) in compose.questions" :key="i">
        <label class="voice-question">
          <span class="text-xs text-fg" x-text="q"></span>
          <input type="text" x-model="compose.answers[i]" @keydown.enter.prevent="composeAnswer()">
        </label>
      </template>
      <div class="flex items-center gap-2 justify-end mt-2">
        <button @click="composeSkip()" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors" x-text="t('compose_skip')"></button>
        <button @click="composeAnswer()" :disabled="compose.busy" class="px-3 py-1 rounded bg-accent text-white text-xs font-medium hover:opacity-90 disabled:opacity-50 transition-opacity" x-text="t('compose_answer')"></button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
      <!-- Raw transcription toggle: when the rewriter drifts, or whisper eats a
           proper noun, this is how you see what you actually said without
           dictating it again. -->
      <div x-show="compose.showRaw">
        <p class="text-xs text-fg-muted mb-1" x-text="t('compose_raw_label')"></p>
        <div class="voice-compose-text whitespace-pre-wrap text-fg-muted" x-text="compose.raw"></div>
      </div>
      <textarea x-show="!compose.showRaw" x-model="compose.text" class="voice-compose-text"></textarea>

      <div class="flex items-center justify-between gap-2 mt-2">
        <span class="text-xs"
          :class="composeOver() ? 'voice-count-over' : (composeNearLimit() ? 'voice-count-warn' : 'text-fg-muted')"
          x-text="composeCount() + ' / ' + voice.maxSendLen"></span>
        <button x-show="compose.raw && compose.raw !== compose.text" @click="compose.showRaw = !compose.showRaw"
          class="text-xs text-fg-muted hover:text-fg underline"
          x-text="compose.showRaw ? t('compose_show_prompt') : t('compose_show_raw')"></button>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 p-3 border-t border-gray-800 shrink-0 flex-wrap">
      <button @click="closeCompose()" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors" x-text="t('compose_discard')"></button>
      <button x-show="compose.raw" @click="composeRetry()" :disabled="compose.busy"
        class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors disabled:opacity-50" x-text="t('compose_retry')"></button>
      <button @click="composeToInput()" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors" x-text="t('compose_to_input')"></button>
      <button @click="composeSend()" :disabled="compose.busy || composeOver() || !compose.text.trim()"
        class="bg-accent text-white rounded-xl px-4 py-2 text-sm font-medium hover:opacity-90 disabled:opacity-50 transition-opacity" x-text="t('compose_send')"></button>
    </div>
  </div>
</div>

<!-- Meta-prompt editor. Opened from the voice section of the settings panel. -->
<div x-show="promptEditor.open" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center voice-overlay p-4" @click.self="promptEditor.open = false">
  <div class="voice-editor-panel flex flex-col w-full max-w-4xl max-h-[92vh] bg-bg-card border border-gray-700 rounded-2xl">
    <div class="flex items-center justify-between gap-2 p-3 border-b border-gray-800 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-sm font-semibold shrink-0" x-text="t('prompt_title')"></span>
        <span class="text-[0.65rem] px-1.5 py-0.5 rounded shrink-0"
          :class="promptEditor.custom ? 'bg-warn/15 text-warn' : 'bg-success/15 text-success'"
          x-text="promptEditor.custom ? t('prompt_custom') : t('prompt_original')"></span>
      </div>
      <button @click="promptEditor.open = false" class="text-fg-muted hover:text-fg text-xl leading-none px-1">&times;</button>
    </div>

    <div class="flex items-center gap-2 px-3 py-2 border-b border-gray-800 shrink-0 flex-wrap">
      <!-- Section jump: editing a 4 KB document in a phone textarea is exactly
           what this is for. -->
      <span class="text-xs text-fg-muted" x-text="t('prompt_section')"></span>
      <select @change="gotoPromptSection($event.target.value); $event.target.selectedIndex = 0" class="tgrid-select">
        <template x-for="sec in promptSections()" :key="sec.index">
          <option :value="sec.index" x-text="sec.label"></option>
        </template>
      </select>
      <span x-show="promptEditor.versions.length" class="text-xs text-fg-muted ml-2" x-text="t('prompt_versions')"></span>
      <select x-show="promptEditor.versions.length" x-model.number="promptEditor.viewing" @change="viewPromptVersion(promptEditor.viewing)" class="tgrid-select">
        <option :value="0" x-text="t('prompt_version_current')"></option>
        <template x-for="v in promptEditor.versions" :key="v">
          <option :value="v" x-text="'v' + v"></option>
        </template>
      </select>
    </div>

    <div class="flex-1 overflow-y-auto p-4" style="overscroll-behavior:contain;-webkit-overflow-scrolling:touch">
      <div x-show="promptEditor.loading" class="text-center py-6 text-fg-muted animate-pulse" x-text="t('loading')"></div>
      <textarea x-show="!promptEditor.loading" id="prompt-editor-text" x-model="promptEditor.content" spellcheck="false" class="voice-prompt-editor"></textarea>
    </div>

    <div class="flex items-center justify-end gap-2 p-3 border-t border-gray-800 shrink-0">
      <button @click="resetPrompt()" class="px-2 py-1 rounded border border-gray-700 hover:bg-bg-hover text-fg-muted hover:text-fg text-xs transition-colors" x-text="t('prompt_reset')"></button>
      <button @click="savePrompt()" :disabled="promptEditor.saving"
        class="bg-accent text-white rounded-xl px-4 py-2 text-sm font-medium hover:opacity-90 disabled:opacity-50 transition-opacity" x-text="t('prompt_save')"></button>
    </div>
  </div>
</div>

<div x-show="toast.show" x-transition
  class="fixed bottom-6 right-6 px-4 py-3 rounded-xl shadow-lg text-sm z-[95] max-w-sm"
  :class="toast.type === 'success' ? 'bg-success/20 text-success border border-success/30' : 'bg-danger/20 text-danger border border-danger/30'"
  x-text="toast.message"></div>

<!-- Login overlay (shown when not authenticated) -->
<div x-show="showLogin" class="fixed inset-0 bg-bg flex items-center justify-center z-[100]">
  <div class="bg-bg-card border border-gray-700 rounded-2xl p-8 w-full max-w-sm mx-4">
    <div class="text-center mb-6">
      <span class="text-4xl">🤖</span>
      <h1 class="text-xl font-semibold mt-3">Claude Sessions</h1>
      <p class="text-sm text-fg-muted mt-1" x-text="totpStep ? t('login_totp_subtitle') : t('login_subtitle')"></p>
    </div>

    <!-- Step 1: credentials -->
    <form x-show="!totpStep" @submit.prevent="doLogin" class="space-y-4">
      <div>
        <label for="login-user" class="block text-sm text-fg-muted mb-1" x-text="t('username')"></label>
        <input id="login-user" type="text" x-model="loginUser" required autocomplete="username"
          class="w-full bg-bg border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-fg focus:outline-none focus:border-accent transition-colors">
      </div>
      <div>
        <label for="login-pass" class="block text-sm text-fg-muted mb-1" x-text="t('password')"></label>
        <input id="login-pass" type="password" x-model="loginPass" required autocomplete="current-password"
          class="w-full bg-bg border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-fg focus:outline-none focus:border-accent transition-colors">
      </div>
      <p x-show="loginError" class="text-sm text-danger" x-text="loginError"></p>
      <button type="submit" class="w-full py-2.5 bg-accent hover:bg-accent-hover text-white rounded-xl text-sm font-medium transition-colors" x-text="t('login_button')"></button>
    </form>

    <!-- Step 2: TOTP code. autocomplete=one-time-code lets iOS/Android offer
         the code straight from the notification / password manager. -->
    <form x-show="totpStep" @submit.prevent="doTotp" class="space-y-4">
      <div>
        <label for="login-totp" class="block text-sm text-fg-muted mb-1" x-text="t('login_totp_label')"></label>
        <input id="login-totp" type="text" x-model="totpCode" required inputmode="numeric" autocomplete="one-time-code"
          maxlength="6" placeholder="123456"
          class="w-full bg-bg border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-fg placeholder:text-fg-muted focus:outline-none focus:border-accent transition-colors font-mono tracking-widest">
      </div>
      <p x-show="totpError" class="text-sm text-danger" x-text="totpError"></p>
      <button type="submit" class="w-full py-2.5 bg-accent hover:bg-accent-hover text-white rounded-xl text-sm font-medium transition-colors" x-text="t('login_totp_button')"></button>
      <button type="button" @click="cancelTotp()" class="w-full text-xs text-fg-muted hover:text-fg transition-colors" x-text="t('login_totp_back')"></button>
    </form>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
