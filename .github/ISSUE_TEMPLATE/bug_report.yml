name: Bug report
description: Something in CCSM is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: CCSM version
      description: The version you are on (see the README or CHANGELOG.md).
      placeholder: e.g. 1.5.2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Package (binary on the host)
        - Container (web app + ccsm-agent over Unix socket)
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: The machine running tmux/claude.
      placeholder: e.g. Ubuntu 24.04 on a Raspberry Pi
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server logs, browser console errors or HTTP responses. Redact any secrets.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, device, profile being used, anything relevant.
