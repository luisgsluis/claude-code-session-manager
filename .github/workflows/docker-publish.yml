name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            goarm: ''
            target: amd64
          - platform: linux/arm64
            arch: arm64
            goarm: ''
            target: arm64
          - platform: linux/arm/v7
            arch: arm
            goarm: '7'
            target: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ccsm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ccsm and ccsm-agent binaries
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: |
          GOOS=linux GOARCH=${{ matrix.arch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/luisgsluis/claude-code-session-manager/internal/server.Version=${{ github.ref_name }}" -o ccsm-${{ matrix.target }} ./cmd/ccsm
          GOOS=linux GOARCH=${{ matrix.arch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=0 go build -ldflags="-s -w" -o ccsm-agent-${{ matrix.target }} ./cmd/ccsm-agent
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ccsm-${{ matrix.target }}
            ccsm-agent-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download binaries
        # Binaries only; excludes the dockerbuild artifacts (buildx cache,
        # names with ~) that made download-all fail.
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
      - name: Checkout static assets
        # A package-mode install (no Docker, so no embedded static/) has no
        # other way to get the UI that matches this release's binaries — the
        # Docker image bundles static/ itself, but the standalone binaries
        # above don't carry it.
        uses: actions/checkout@v4
        with:
          sparse-checkout: static
          sparse-checkout-cone-mode: false
      - name: Package static assets
        run: tar czf static.tar.gz static
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries-*/ccsm-*
            binaries-*/ccsm-agent-*
            static.tar.gz
          generate_release_notes: true
