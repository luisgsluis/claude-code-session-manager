name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ccsm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            goarm: ''
            target: amd64
          - platform: linux/arm64
            arch: arm64
            goarm: ''
            target: arm64
          - platform: linux/arm/v7
            arch: arm
            goarm: '7'
            target: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Each matrix job builds ONE platform and pushes it by digest only — no
      # tag. If the three jobs pushed the shared tags (3.7.3 / 3.7 / latest)
      # in parallel, as they did before, the last one to finish would win and
      # overwrite the others, so the published tag ended up single-arch
      # (whichever arch raced last — arm/v7 for v3.7.1 and v3.7.2). The `merge`
      # job below assembles the per-arch digests into one real manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build ccsm and ccsm-agent binaries
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: |
          GOOS=linux GOARCH=${{ matrix.arch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/luisgsluis/claude-code-session-manager/internal/server.Version=${{ github.ref_name }}" -o ccsm-${{ matrix.target }} ./cmd/ccsm
          GOOS=linux GOARCH=${{ matrix.arch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=0 go build -ldflags="-s -w" -o ccsm-agent-${{ matrix.target }} ./cmd/ccsm-agent
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ccsm-${{ matrix.target }}
            ccsm-agent-${{ matrix.target }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout static assets
        # A package-mode install (no Docker, so no embedded static/) has no
        # other way to get the UI that matches this release's binaries — the
        # Docker image bundles static/ itself, but the standalone binaries
        # above don't carry it.
        # Must run BEFORE downloading the binaries: checkout's default
        # clean:true wipes the working directory first, which deleted the
        # just-downloaded binaries-*/ dirs when this ran second (v3.6.0
        # shipped with only static.tar.gz because of this).
        uses: actions/checkout@v4
        with:
          sparse-checkout: static
          sparse-checkout-cone-mode: false
      - name: Download binaries
        # Binaries only; excludes the dockerbuild artifacts (buildx cache,
        # digests, names with ~) that made download-all fail.
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
      - name: Package static assets
        run: tar czf static.tar.gz static
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries-*/ccsm-*
            binaries-*/ccsm-agent-*
            static.tar.gz
          generate_release_notes: true
